[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-simulator"
version = "0.7.0.dev0"
description = "Interactive 3D N-body gravity simulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "glcontext==3.0.0",
    "glfw==2.10.2",
    "imgui-bundle==1.92.801",
    "llvmlite==0.48.0",
    "moderngl==5.12.0",
    "numba==0.66.0",
    "numpy==2.4.6",
    "PyOpenGL==3.1.10",
    "PyOpenGL-accelerate==3.1.10",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.3",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[project.scripts]
gravity = "gravity.app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "hardware: requires supported graphics hardware and a real OpenGL context",
    "slow: intentionally long-running validation",
]

[tool.coverage.run]
branch = true
source = ["gravity"]
omit = [
    "src/gravity/diagnostics/jit_smoke.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@njit",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/gravity", "tools/bootstrap.py"]

[[tool.mypy.overrides]]
module = [
    "glfw",
    "imgui_bundle.python_backends.*",
    "moderngl",
    "numba",
    "numba.*",
    "OpenGL",
    "OpenGL.*",
]
ignore_missing_imports = true
