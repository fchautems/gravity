<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BTC Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Tableau de bord BTC</h1>

    <section id="dca-form">
        <h2>Simulation DCA</h2>
        <label>Date de début <input type="date" id="start_date"></label>
        <label>Montant par achat (USD) <input type="number" id="amount" value="100"></label>
        <label>Fréquence
            <select id="frequency">
                <option value="weekly">Hebdomadaire</option>
                <option value="monthly">Mensuelle</option>
            </select>
        </label>
        <label id="day_week_label">Jour de la semaine
            <select id="day_week">
                <option value="0">Lundi</option>
                <option value="1">Mardi</option>
                <option value="2">Mercredi</option>
                <option value="3">Jeudi</option>
                <option value="4">Vendredi</option>
                <option value="5">Samedi</option>
                <option value="6">Dimanche</option>
            </select>
        </label>
        <label id="day_month_label" style="display:none;">Jour du mois
            <input type="number" id="day_month" min="1" max="31" value="1">
        </label>
        <button id="calc_btn">Calculer</button>
        <pre id="dca_result"></pre>
    </section>

    <section>
        <canvas id="priceChart"></canvas>
    </section>
    <section>
        <canvas id="fgChart"></canvas>
    </section>

    <script src="/static/script.js"></script>
</body>
</html>
