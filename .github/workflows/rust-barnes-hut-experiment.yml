name: Rust Barnes-Hut experiment
on:
  push:
    branches: [experiment/rust-barnes-hut]
  workflow_dispatch:
jobs:
  rust-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --manifest-path experiments/rust-barnes-hut/Cargo.toml --release
      - name: Rust optimized build
        run: cargo build --manifest-path experiments/rust-barnes-hut/Cargo.toml --release
      - name: Rust direct-force reference (not comparable to Barnes-Hut)
        run: cargo run --manifest-path experiments/rust-barnes-hut/Cargo.toml --release --example direct_reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run existing Numba baseline
        run: python benchmarks/step6_barnes_hut.py --json > numba-baseline.json
      - name: Same-tree Rust versus Numba comparison
        run: python experiments/rust-barnes-hut/compare_same_tree.py > same-tree-results.json
      - name: Show comparison
        run: cat same-tree-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-experiment-baseline
          path: |
            numba-baseline.json
            same-tree-results.json
          if-no-files-found: ignore
